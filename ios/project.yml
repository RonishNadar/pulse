# Xcode project for Pulse on iPhone, generated with XcodeGen (brew install xcodegen):
#   cd ios && xcodegen && open Pulse.xcodeproj
# The web UI is copied from the repo root at build time, so desktop and iPhone share one codebase.
# Build type: friends build if ../spotify_client_id.txt exists, else public (set PULSE_PUBLIC=1 to force public).
name: Pulse
options:
  bundleIdPrefix: com.ronishnadar
  deploymentTarget:
    iOS: "16.4"
packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    from: 5.0.1
targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - Pulse
    dependencies:
      - package: SpotifyiOS
    info:
      path: Pulse/Info.plist
      properties:
        CFBundleDisplayName: Pulse
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        LSApplicationQueriesSchemes: [spotify] # to check the Spotify app is installed
        CFBundleURLTypes:
          - CFBundleURLName: com.ronishnadar.pulse
            CFBundleURLSchemes: [pulse] # pulse://callback: Spotify login and the Spotify app hand back here
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronishnadar.pulse
        PRODUCT_NAME: Pulse
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO # the copy step below writes into the app bundle
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AC7DU796S6 # Ronish Nadar (Personal Team); change to your own team ID to build it yourself
    postCompileScripts:
      - name: Copy web UI
        basedOnDependencyAnalysis: false
        script: |
          set -e
          WEB="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web"
          mkdir -p "$WEB"
          cd "$SRCROOT/.."
          cp index.html style.css dither.js app.js extras.js "$WEB/"
          if [ -z "${PULSE_PUBLIC:-}" ] && [ -s spotify_client_id.txt ]; then
            printf '{"clientId":"%s"}\n' "$(tr -d ' \t\r\n' < spotify_client_id.txt)" > "$WEB/build.json"
            echo "Pulse: friends build (built-in Client ID)"
          else
            echo '{}' > "$WEB/build.json"
            echo "Pulse: public build (each user enters a Client ID)"
          fi
